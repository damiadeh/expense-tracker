[package]
name = "expense-tracker"
version = "0.1.0"
edition = "2024"
description = "A command-line expense tracker backed by SQLite"
license = "MIT"

# The binary is named `et` for short invocations, while the package/library
# keeps the descriptive name `expense_tracker`.
[[bin]]
name = "et"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2.0.20"

[dev-dependencies]
tempfile = "3.27.0"
